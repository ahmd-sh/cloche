name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CERT_SHA256: cd0e700aee2266eff1d3cb8315e237d9a827e8b525903cb4d81fc3772aec563a

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(cat VERSION)
          if ! printf '%s' "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::VERSION isn't X.Y.Z: $v"
            exit 1
          fi
          if [ "$TAG" != "v$v" ]; then
            echo "::error::tag $TAG doesn't match VERSION $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  cli:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: scripts/dist.sh "$VERSION" dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: dist/
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - name: build
        env:
          KEYSTORE: ${{ secrets.CLOCHE_KEYSTORE_BASE64 }}
          CLOCHE_KEYSTORE_PASSWORD: ${{ secrets.CLOCHE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$CLOCHE_KEYSTORE_PASSWORD" ]; then
            echo "::error::the release environment needs CLOCHE_KEYSTORE_BASE64 and CLOCHE_KEYSTORE_PASSWORD"
            exit 1
          fi
          export CLOCHE_KEYSTORE="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE" | base64 -d > "$CLOCHE_KEYSTORE"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          rm -f "$CLOCHE_KEYSTORE"
      - name: check the signer and version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$tools/apksigner" verify --print-certs "$apk" > certs.txt
          cat certs.txt
          digests=$(grep -Eo 'certificate SHA-256 digest: [0-9a-f]{64}$' certs.txt | grep -Eo '[0-9a-f]{64}$' || :)
          if [ "$digests" != "$CERT_SHA256" ]; then
            echo "::error::cloche.apk isn't signed by the release key alone"
            exit 1
          fi
          "$tools/aapt2" dump badging "$apk" > badging.txt
          sed -n 1p badging.txt
          grep -q "^package: name='sh.ahmd.cloche' .* versionName='$VERSION'" badging.txt
          mkdir -p ../dist
          cp "$apk" ../dist/cloche.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: dist/cloche.apk
          if-no-files-found: error

  publish:
    needs: [version, cli, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums and latest.json
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha256sum cloche-* cloche.apk > checksums.txt
          cat checksums.txt
          jq -n --arg version "$VERSION" --rawfile sums checksums.txt '{
            version: $version,
            files: ($sums | split("\n") | map(select(length > 0) | split("  ") | {(.[1]): .[0]}) | add)
          }' > latest.json
          cat latest.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
